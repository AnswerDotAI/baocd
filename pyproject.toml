[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "baocd"
dynamic = ["version"]
description = "Advent of Code Data reimplemented in BPL Python (BasedPL)"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{name = "baocd contributors"}]
keywords = ['nbdev', 'basedpl', 'advent-of-code', 'aocd']
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
    "basedpl>=0.1.95",
]

[project.optional-dependencies]
dev = ["fastcore>=1.7"]

[project.urls]
Repository = "https://github.com/AnswerDotAI/baocd"
Documentation = "https://AnswerDotAI.github.io/baocd/"

[project.entry-points.nbdev]
baocd = "baocd._modidx:d"

[tool.setuptools.dynamic]
version = {attr = "baocd.__version__"}

[tool.setuptools.packages.find]
include = ["baocd"]

[tool.nbdev]
nbs_path = "nbs"
lib_path = "baocd"
